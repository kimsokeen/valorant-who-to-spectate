# Screen regions of the VCT Champions 2026 broadcast overlay.
# Values are fractions of the frame: x, y = top-left corner; w, h = size.
# Measured on 1920x1080 frames from the Grand Final (Summit, rounds 1 and 5).
# extract_crops.py adds an 8% margin around every box.
overlay: champions-2026
calibrated: true    # checked on Grand Final gameplay frames, 2026-11-12

regions:
  minimap:     {x: 0.021, y: 0.028, w: 0.203, h: 0.361}   # 40-430 px, 30-420 px
  hud_top:     {x: 0.333, y: 0.000, w: 0.333, h: 0.079}   # score bar: teams, score, round, timer
  round_timer: {x: 0.477, y: 0.005, w: 0.047, h: 0.062}   # "1:30"
  team_left:   {x: 0.008, y: 0.507, w: 0.164, h: 0.480}   # 5 player cards: name, health, armor, money, weapon, ult
  team_right:  {x: 0.828, y: 0.507, w: 0.165, h: 0.480}   # spectated player's card has a yellow border
  pov_name:    {x: 0.247, y: 0.878, w: 0.128, h: 0.052}   # "LOUD luk xo" above the ability bar
  # Verified on the Grand Final preview (kills visible).
  kill_feed:   {x: 0.755, y: 0.074, w: 0.240, h: 0.230}

# Gameplay detection: HUD text that only shows during live play.
# Marker pictures are learned by scripts/build_markers.py into configs/markers/.
gameplay:
  threshold: 0.7
  markers:
    # "CURRENT:" top-left. slides: its x moves with the map number (20 px on map 1, 222 px on map 2)
    current_label: {x: 0.0104, y: 0.0028, w: 0.0427, h: 0.0157, slides: true}
    round_label:   {x: 0.4792, y: 0.0083, w: 0.0323, h: 0.0157}   # "ROUND" above the timer
